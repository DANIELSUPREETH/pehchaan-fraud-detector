name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Unit and end-to-end tests
        run: pytest -q
      - name: Full offline pipeline run
        run: |
          python -m pehchaan.generator --persons 1500 --rings 8
          python -m pehchaan.offline --fresh
