# Full streaming stack: Kafka + PostgreSQL + stream processor + REST API.
#   docker compose up -d --build                      start everything
#   docker compose run --rm tools python -m pehchaan.generator
#   docker compose run --rm tools python -m pehchaan.stream.producer --rate 300
#   docker compose run --rm tools python -m pehchaan.analyze

x-app: &app
  build: .
  image: pehchaan-app
  environment:
    PEHCHAAN_DB_URL: postgresql://pehchaan:pehchaan@postgres:5432/pehchaan
    KAFKA_BOOTSTRAP: kafka:29092
    PEHCHAAN_DATA_DIR: /app/data
  volumes:
    - ./data:/app/data
  depends_on:
    kafka:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"   # for tools running on your host machine
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller        # KRaft mode: no ZooKeeper needed
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pehchaan
      POSTGRES_PASSWORD: pehchaan
      POSTGRES_DB: pehchaan
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pehchaan -d pehchaan"]
      interval: 5s
      timeout: 5s
      retries: 12

  processor:
    <<: *app
    command: python -m pehchaan.stream.processor
    restart: unless-stopped   # crash -> restart -> warm start from the database

  api:
    <<: *app
    command: uvicorn pehchaan.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  tools:   # one-off commands: generator, producer, analysis, tests
    <<: *app
    profiles: ["tools"]
    command: python -m pehchaan.generator

volumes:
  pgdata:
